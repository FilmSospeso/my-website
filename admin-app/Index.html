<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f5f4f1; --panel: #ffffff; --ink: #1b1b1f; --muted: #6b6b73; --line: #e4e2dc;
    --navy: #1f2d4d; --accent: #c8553d; --ok: #2f7d4f; --warn: #b7791f; --soft: #f0eee9;
    --radius: 10px; --font: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
  button, input, select, textarea { font: inherit; color: inherit; }
  header { background: var(--navy); color: #fff; padding: 0 20px; display: flex; align-items: center; gap: 24px; height: 56px; position: sticky; top: 0; z-index: 5; }
  header .brand { font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
  header .brand small { font-weight: 400; opacity: .6; margin-left: 6px; }
  nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  nav button { background: none; border: 0; color: rgba(255,255,255,.65); padding: 8px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  nav button:hover { color: #fff; background: rgba(255,255,255,.08); }
  nav button.on { color: #fff; background: rgba(255,255,255,.16); font-weight: 600; }
  nav button .badge { background: var(--accent); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
  header .who { font-size: 12px; opacity: .7; white-space: nowrap; }
  header a { color: #fff; }
  main { max-width: 1240px; margin: 0 auto; padding: 24px 20px 80px; }
  h1 { font-size: 20px; margin: 0 0 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 .spacer { flex: 1; }
  h1 .btn, h1 .search { font-size: 14px; font-weight: 400; }
  h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 0 12px; }
  .grid { display: grid; gap: 16px; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 16px; }
  .two { grid-template-columns: 1fr 1fr; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; } header .who { display: none; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .v { font-size: 24px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .bar-row { display: grid; grid-template-columns: 90px 1fr 60px; align-items: center; gap: 10px; margin: 6px 0; font-size: 13px; }
  .bar { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--navy); border-radius: 4px; }
  .bar-row .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .list-item { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .list-item:last-child { border-bottom: 0; }
  .list-item .when { color: var(--muted); width: 110px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .list-item .src { margin-left: auto; color: var(--muted); font-size: 11px; }
  .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: #c9c6bd; }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip span { opacity: .6; margin-left: 4px; }
  .search { border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; min-width: 220px; background: var(--panel); }
  .inq { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 14px 16px; border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); margin-bottom: 8px; cursor: pointer; }
  .inq:hover { border-color: #c9c6bd; }
  .inq .who { font-weight: 600; }
  .inq .who small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .inq .msg { grid-column: 1 / -1; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .inq .meta { text-align: right; font-size: 12px; color: var(--muted); }
  .pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; background: var(--soft); color: var(--ink); }
  .pill.new { background: #fde8e3; color: var(--accent); }
  .pill.ok { background: #e2f1e8; color: var(--ok); }
  .pill.hi { background: #fff1d6; color: var(--warn); }
  .table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  th { background: var(--soft); font-weight: 600; position: sticky; top: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: #faf9f6; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  /* 오른쪽 패널 / 모달 */
  .scrim { position: fixed; inset: 0; background: rgba(20,20,30,.35); z-index: 20; display: flex; justify-content: flex-end; }
  .scrim.center { justify-content: center; align-items: center; padding: 16px; }
  .drawer { background: var(--panel); width: min(560px, 100%); height: 100%; overflow-y: auto; padding: 24px; box-shadow: -8px 0 24px rgba(0,0,0,.12); }
  .modal { background: var(--panel); width: min(480px, 100%); max-height: 90vh; overflow-y: auto; padding: 24px; border-radius: 14px; }
  .drawer h3, .modal h3 { margin: 0 0 4px; font-size: 18px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; word-break: break-all; }
  .sub a { color: inherit; }
  .message { white-space: pre-wrap; background: var(--soft); border-radius: 8px; padding: 14px; margin-bottom: 18px; font-size: 13px; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form .full { grid-column: 1 / -1; }
  .form label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .form input, .form select, .form textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; }
  .form textarea { min-height: 80px; resize: vertical; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .check input { width: auto; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
  .actions .spacer { flex: 1; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 8px; z-index: 50; font-size: 13px; max-width: 90vw; }
  .toast.err { background: #a3261b; }
  .loading { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="brand">FILM SOSPESO<small>관리</small></div>
  <nav id="nav"></nav>
  <div class="who" id="who"></div>
</header>
<main id="main"><div class="loading">불러오는 중…</div></main>

<script>
/* ── 공통 ─────────────────────────────────────────── */
const S = { boot: null, view: 'dashboard', tables: {}, inqStatus: '전체', search: {} };
const NEW_STATUSES = ['접수대기', '신규', ''];

// 서버 함수 호출 (google.script.run → Promise)
function run(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}

// 안전한 DOM 생성: 모든 텍스트는 textContent 로 들어가므로 문의 내용에 섞인 HTML/스크립트가 실행되지 않음
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  let value;
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'value') value = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(Infinity).forEach(c => {
    if (c == null || c === false) return;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  });
  if (value != null) el.value = value;
  return el;
}
const $main = () => document.getElementById('main');
function mount(...nodes) { $main().replaceChildren(...nodes.flat(Infinity).filter(n => n != null && n !== false)); }
function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : null; }
function won(n) { return '₩' + Math.round(n || 0).toLocaleString('ko-KR'); }
function toast(msg, err) {
  const t = h('div', { class: 'toast' + (err ? ' err' : '') }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), err ? 6000 : 2800);
}
function fail(e) { toast((e && e.message) || String(e), true); }
function closeOverlay() { document.querySelectorAll('.scrim').forEach(s => s.remove()); }
function overlay(panel, center) {
  closeOverlay();
  const s = h('div', { class: 'scrim' + (center ? ' center' : ''), onclick: e => { if (e.target === s) closeOverlay(); } }, panel);
  document.body.append(s);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });

function cell(t, r, field) { const i = t.fields[field]; return i > -1 ? (r.cells[i] || '') : ''; }
function head(t, field) { const i = t.fields[field]; return i > -1 ? t.headers[i] : null; }
function statusClass(s) {
  if (NEW_STATUSES.includes(s)) return 'pill new';
  if (/완료|계약/.test(s)) return 'pill ok';
  return 'pill';
}

async function loadTable(key, force) {
  if (!S.tables[key] || force) S.tables[key] = await run('getTable', key);
  return S.tables[key];
}

/* ── 상단 메뉴 ────────────────────────────────────── */
function renderNav() {
  const items = [{ key: 'dashboard', label: '대시보드' }].concat(S.boot.tabs.filter(t => t.exists));
  const nav = document.getElementById('nav');
  const inq = S.tables.inquiry;
  const newCount = inq ? inq.rows.filter(r => NEW_STATUSES.includes(cell(inq, r, 'status'))).length : 0;
  nav.replaceChildren(...items.map(it => h('button', {
    class: S.view === it.key ? 'on' : '', onclick: () => go(it.key)
  }, it.label, it.key === 'inquiry' && newCount ? h('span', { class: 'badge' }, newCount) : null)));
}

async function go(view) {
  S.view = view; renderNav();
  mount(h('div', { class: 'loading' }, '불러오는 중…'));
  try {
    if (view === 'dashboard') await renderDashboard();
    else if (view === 'inquiry') await renderInquiries();
    else await renderTable(view);
  } catch (e) { mount(h('div', { class: 'empty' }, (e && e.message) || String(e))); }
  renderNav();
}

/* ── 대시보드 ─────────────────────────────────────── */
async function renderDashboard() {
  const [d] = await Promise.all([run('getDashboard'), loadTable('inquiry')]);
  const i = d.inquiry;
  const max = Math.max(1, ...Object.values(i.byStatus));
  const tiles = h('div', { class: 'grid tiles' },
    tile('최근 30일 문의', i.recent + '건', '전체 ' + i.total + '건'),
    tile('진행 중', i.open + '건', '견적 ' + won(i.openQuote)),
    tile('계약 견적 합계', won(i.wonQuote), '계약완료 기준'),
    d.payment && d.payment.hasAmount ? tile('입금 합계', won(d.payment.total), '입금현황 탭') : null
  );
  const statusCard = h('div', { class: 'card' }, h('h2', null, '진행상태별 문의'),
    Object.entries(i.byStatus).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
      h('div', { class: 'bar-row' }, h('span', null, k),
        h('div', { class: 'bar' }, h('i', { style: 'width:' + (v / max * 100) + '%' })),
        h('span', { class: 'n' }, v + '건'))),
    !i.total ? h('div', { class: 'empty' }, '아직 문의가 없습니다') : null
  );
  const upCard = h('div', { class: 'card' },
    h('h2', null, '앞으로 14일 일정'),
    d.calendarError ? h('div', { class: 'sub' }, '캘린더: ' + d.calendarError) : null,
    d.upcoming.length ? d.upcoming.map(u => h('div', { class: 'list-item' },
      h('span', { class: 'when' }, u.label), h('span', null, u.title), h('span', { class: 'src' }, u.source)))
      : h('div', { class: 'empty' }, '예정된 일정이 없습니다'),
    h('div', { class: 'actions' }, h('button', { class: 'btn', onclick: () => openEvent({}) }, '+ 일정 추가'))
  );
  const payCard = d.payment && d.payment.hasAmount ? h('div', { class: 'card' }, h('h2', null, '입금 상태별 금액'),
    Object.entries(d.payment.byStatus).map(([k, v]) => h('div', { class: 'list-item' },
      h('span', { class: 'when' }, k), h('span', null, won(v))))) : null;

  mount(h('h1', null, '대시보드', h('span', { class: 'spacer' }),
          h('button', { class: 'btn', onclick: () => { S.tables = {}; go('dashboard'); } }, '새로고침')),
        tiles, h('div', { class: 'grid two' }, statusCard, upCard, payCard));
}
function tile(k, v, s) { return h('div', { class: 'card tile' }, h('div', { class: 'k' }, k), h('div', { class: 'v' }, v), h('div', { class: 's' }, s)); }

/* ── 문의함 ──────────────────────────────────────── */
async function renderInquiries(force) {
  const t = await loadTable('inquiry', force);
  const statusH = head(t, 'status');
  const statuses = ['전체'].concat((statusH && t.options[statusH]) || []);
  const counts = {};
  t.rows.forEach(r => { const s = cell(t, r, 'status'); counts[s] = (counts[s] || 0) + 1; });
  const q = (S.search.inquiry || '').toLowerCase();
  const rows = t.rows.slice().reverse().filter(r =>
    (S.inqStatus === '전체' || cell(t, r, 'status') === S.inqStatus) &&
    (!q || r.cells.join(' ').toLowerCase().includes(q)));

  mount(
    h('h1', null, '문의함', h('span', { class: 'spacer' }),
      h('input', { class: 'search', placeholder: '이름, 회사, 내용 검색', value: S.search.inquiry || '',
        oninput: e => { S.search.inquiry = e.target.value; renderInquiries(); setTimeout(() => focusSearch(), 0); } }),
      h('button', { class: 'btn', onclick: () => renderInquiries(true) }, '새로고침')),
    h('div', { class: 'chips' }, statuses.map(s => h('button', {
      class: 'chip' + (S.inqStatus === s ? ' on' : ''), onclick: () => { S.inqStatus = s; renderInquiries(); }
    }, s, h('span', null, s === '전체' ? t.rows.length : (counts[s] || 0))))),
    rows.length ? rows.map(r => h('div', { class: 'inq', onclick: () => openInquiry(r) },
      h('div', { class: 'who' }, cell(t, r, 'name') || '(이름 없음)', h('small', null, cell(t, r, 'company'))),
      h('div', { class: 'meta' },
        cell(t, r, 'priority') ? h('span', { class: /high|높/i.test(cell(t, r, 'priority')) ? 'pill hi' : 'pill' }, cell(t, r, 'priority')) : null, ' ',
        h('span', { class: statusClass(cell(t, r, 'status')) }, cell(t, r, 'status') || '미지정')),
      h('div', { class: 'msg' }, [cell(t, r, 'date'), cell(t, r, 'type'), cell(t, r, 'message')].filter(Boolean).join(' · '))
    )) : h('div', { class: 'empty' }, '해당하는 문의가 없습니다')
  );
}
function focusSearch() { const s = document.querySelector('.search'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }

function openInquiry(r) {
  const t = S.tables.inquiry;
  const name = cell(t, r, 'name'), email = cell(t, r, 'email'), link = cell(t, r, 'link');
  const editable = ['status', 'priority', 'quote', 'lastContact', 'owner', 'client', 'project', 'memo'];
  const inputs = {};
  const fields = editable.filter(f => t.fields[f] > -1).map(f => {
    const hd = head(t, f);
    const el = inputFor(t, hd, cell(t, r, f), f === 'memo');
    inputs[hd] = el;
    return h('div', { class: f === 'memo' ? 'full' : '' }, h('label', null, hd), el);
  });
  const mailto = email ? 'mailto:' + encodeURIComponent(email) + '?subject=' +
    encodeURIComponent('[Film Sospeso] ' + (cell(t, r, 'type') || '') + ' 문의 회신') : null;

  overlay(h('div', { class: 'drawer' },
    h('h3', null, name || '(이름 없음)'),
    h('div', { class: 'sub' },
      [cell(t, r, 'company'), email, cell(t, r, 'type'), cell(t, r, 'date')].filter(Boolean).join(' · '),
      safeUrl(link) ? [h('br'), h('a', { href: safeUrl(link), target: '_blank', rel: 'noopener' }, link)] : null),
    h('div', { class: 'message' }, cell(t, r, 'message') || '(내용 없음)'),
    h('div', { class: 'form' }, fields),
    h('div', { class: 'actions' },
      h('button', { class: 'btn primary', onclick: async e => {
        e.target.disabled = true;
        try { await saveFrom('inquiry', r, inputs); closeOverlay(); toast('저장했습니다'); renderInquiries(true); }
        catch (err) { fail(err); e.target.disabled = false; }
      } }, '저장'),
      mailto ? h('a', { class: 'btn', href: mailto, target: '_blank' }, '답장 메일') : null,
      h('button', { class: 'btn', onclick: () => openEvent({
        title: (cell(t, r, 'company') || name) + ' 미팅', guests: email, type: '미팅',
        description: '문의 내용:\n' + cell(t, r, 'message')
      }) }, '미팅 잡기'),
      h('button', { class: 'btn', onclick: async e => {
        e.target.disabled = true;
        try { const msg = await run('convertInquiry', r.row, r.cells); toast(msg); closeOverlay();
              delete S.tables.client; delete S.tables.contact; renderInquiries(true); }
        catch (err) { fail(err); e.target.disabled = false; }
      } }, '고객으로 등록'),
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn', onclick: closeOverlay }, '닫기'))
  ));
}

/* ── 일반 탭 (고객사·담당자·프로젝트·일정·입금) ─────── */
async function renderTable(key, force) {
  const t = await loadTable(key, force);
  const cols = t.headers.map((hd, i) => ({ hd, i })).filter(c => c.hd);
  const q = (S.search[key] || '').toLowerCase();
  const rows = t.rows.filter(r => !q || r.cells.join(' ').toLowerCase().includes(q));
  mount(
    h('h1', null, t.label, h('span', { class: 'spacer' }),
      h('input', { class: 'search', placeholder: '검색', value: S.search[key] || '',
        oninput: e => { S.search[key] = e.target.value; renderTable(key); setTimeout(() => focusSearch(), 0); } }),
      key === 'task' ? h('button', { class: 'btn accent', onclick: () => openEvent({}) }, '+ 캘린더 일정') : null,
      h('button', { class: 'btn primary', onclick: () => openEditor(key, null) }, '+ 추가'),
      h('button', { class: 'btn', onclick: () => renderTable(key, true) }, '새로고침')),
    rows.length ? h('div', { class: 'table-wrap' }, h('table', null,
      h('thead', null, h('tr', null, cols.map(c => h('th', null, c.hd)))),
      h('tbody', null, rows.map(r => h('tr', { onclick: () => openEditor(key, r) },
        cols.map(c => h('td', { title: r.cells[c.i] }, r.cells[c.i])))))
    )) : h('div', { class: 'empty card' }, q ? '검색 결과가 없습니다' : '아직 데이터가 없습니다. 오른쪽 위 [+ 추가]로 시작하세요.')
  );
}

function openEditor(key, r) {
  const t = S.tables[key];
  const inputs = {};
  const fields = t.headers.map((hd, i) => {
    if (!hd || hd === '캘린더ID') return null;
    const val = r ? r.cells[i] : '';
    const long = /메모|내용|비고|설명|메시지/.test(hd) || (val && val.length > 60);
    const el = inputFor(t, hd, val, long);
    inputs[hd] = el;
    return h('div', { class: long ? 'full' : '' }, h('label', null, hd), el);
  });
  overlay(h('div', { class: 'drawer' },
    h('h3', null, r ? t.label + ' 수정' : t.label + ' 추가'),
    h('div', { class: 'sub' }, r ? '시트 ' + r.row + '행' : '시트의 다음 빈 행에 추가됩니다'),
    h('div', { class: 'form' }, fields),
    h('div', { class: 'actions' },
      h('button', { class: 'btn primary', onclick: async e => {
        e.target.disabled = true;
        try { await saveFrom(key, r, inputs); closeOverlay(); toast('저장했습니다'); renderTable(key, true); }
        catch (err) { fail(err); e.target.disabled = false; }
      } }, '저장'),
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn', onclick: closeOverlay }, '닫기'))
  ));
}

// 드롭다운이 걸린 열은 선택 상자, 나머지는 입력칸
function inputFor(t, hd, val, long) {
  const opts = t.options[hd];
  if (opts && opts.length) {
    const list = opts.includes(val) || !val ? opts : [val].concat(opts);
    return h('select', { value: val }, h('option', { value: '' }, '—'), list.map(o => h('option', { value: o }, o)));
  }
  return long ? h('textarea', { value: val }) : h('input', { value: val });
}

async function saveFrom(key, r, inputs) {
  const t = S.tables[key];
  const values = {};
  Object.entries(inputs).forEach(([hd, el]) => {
    const i = t.headers.indexOf(hd);
    const before = r ? r.cells[i] : '';
    if (el.value !== before) values[hd] = el.value;
  });
  if (!Object.keys(values).length) return { changed: 0 };
  return run('saveRow', key, r ? r.row : null, r ? r.cells : null, values);
}

/* ── 캘린더 일정 ─────────────────────────────────── */
function openEvent(p) {
  const today = new Date(); const pad = n => String(n).padStart(2, '0');
  const f = {
    title: h('input', { value: p.title || '' }),
    date: h('input', { type: 'date', value: today.getFullYear() + '-' + pad(today.getMonth() + 1) + '-' + pad(today.getDate()) }),
    start: h('input', { type: 'time', value: '14:00' }),
    end: h('input', { type: 'time', value: '15:00' }),
    location: h('input', { value: p.location || '' }),
    guests: h('input', { value: p.guests || '', placeholder: '쉼표로 구분' }),
    description: h('textarea', { value: p.description || '' }),
    sendInvites: h('input', { type: 'checkbox' }),
    addTask: h('input', { type: 'checkbox', checked: true })
  };
  const allDay = h('input', { type: 'checkbox', onchange: e => { f.start.disabled = f.end.disabled = e.target.checked; } });
  overlay(h('div', { class: 'modal' },
    h('h3', null, '캘린더 일정 추가'),
    h('div', { class: 'sub' }, '구글 캘린더에 등록되고, 팀 캘린더를 쓰면 팀원 모두에게 보입니다.'),
    h('div', { class: 'form' },
      h('div', { class: 'full' }, h('label', null, '제목 *'), f.title),
      h('div', { class: 'full' }, h('label', null, '날짜 *'), f.date),
      h('div', null, h('label', null, '시작'), f.start),
      h('div', null, h('label', null, '종료'), f.end),
      h('label', { class: 'check full' }, allDay, '종일 일정'),
      h('div', { class: 'full' }, h('label', null, '장소'), f.location),
      h('div', { class: 'full' }, h('label', null, '참석자 이메일'), f.guests),
      h('label', { class: 'check full' }, f.sendInvites, '참석자에게 초대 메일 보내기'),
      h('div', { class: 'full' }, h('label', null, '메모'), f.description),
      h('label', { class: 'check full' }, f.addTask, "'할일 및 미팅' 탭에도 기록")),
    h('div', { class: 'actions' },
      h('button', { class: 'btn primary', onclick: async e => {
        if (!f.title.value || !f.date.value) return toast('제목과 날짜를 입력하세요', true);
        e.target.disabled = true;
        try {
          await run('createEvent', {
            title: f.title.value, date: f.date.value,
            start: allDay.checked ? '' : f.start.value, end: allDay.checked ? '' : f.end.value,
            location: f.location.value, guests: f.guests.value, description: f.description.value,
            sendInvites: f.sendInvites.checked, addTask: f.addTask.checked, type: p.type || ''
          });
          closeOverlay(); toast('캘린더에 등록했습니다'); delete S.tables.task;
          if (S.view === 'task' || S.view === 'dashboard') go(S.view);
        } catch (err) { fail(err); e.target.disabled = false; }
      } }, '등록'),
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn', onclick: closeOverlay }, '취소'))
  ), true);
}

/* ── 시작 ─────────────────────────────────────────── */
(async function init() {
  try {
    S.boot = await run('getBootstrap');
    document.getElementById('who').replaceChildren(S.boot.email, ' · ',
      h('a', { href: S.boot.sheetUrl, target: '_blank' }, '시트 열기'));
    const missing = S.boot.tabs.filter(t => !t.exists).map(t => t.sheet);
    if (missing.length) toast("시트에 없는 탭: " + missing.join(', ') + " (Code.gs 의 TABS 확인)", true);
    go('dashboard');
  } catch (e) { mount(h('div', { class: 'empty' }, (e && e.message) || String(e))); }
})();
</script>
